name: Validate game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-save-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Continuity check (IDs, handoff, cache version)
        run: node scripts/agent.mjs check
      - name: Check syntax and cloud-save regressions
        run: |
          node tests/cloud-backend.cjs
          node tests/cloud-flow.cjs
          node tests/recovery-export.cjs
          node tests/logout-session.cjs
          node tests/gameplay.cjs
          node tests/inventory.cjs
          node tests/player-history.cjs
          node tests/tap-input.cjs
          node tests/layout.cjs
          node tests/robustness.cjs
          node tests/improvements.cjs
          node tests/iconografia.cjs
          node tests/admin.cjs
          node tests/desafios.cjs
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/lito-browser-tools" playwright@1.62.1
          node "$RUNNER_TEMP/lito-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Mobile and desktop browser checks
        run: |
          node scripts/dev.mjs --host 0.0.0.0 --port 4173 &
          NODE_PATH="$RUNNER_TEMP/lito-browser-tools/node_modules" QA_OUTPUT="$RUNNER_TEMP/lito-browser-evidence" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lito-browser-evidence
          path: ${{ runner.temp }}/lito-browser-evidence
          retention-days: 7
